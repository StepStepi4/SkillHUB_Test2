<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тренажер - SkillHUB</title>
    <meta name="theme-color" content="#f2f2f7">
    <link rel="stylesheet" href="css/Simulator.css">
</head>
<body>

<div class="container">
    
    <div id="menuView" class="view active">
        <div class="header">
            <button class="back-btn-sleek" onclick="window.location.href='Education.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="header-title">Тренажер 💬</div>
            <div style="width: 40px;"></div>
        </div>
        <div class="menu-list" id="scenariosList">
            </div>
    </div>

    <div id="chatView" class="view">
        <div class="header">
            <button class="back-btn-sleek" onclick="closeChat()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="header-title" style="font-size: 16px;">Діалог з клієнтом</div>
            <div style="width: 40px;"></div>
        </div>
        
        <div class="chat-area" id="chatArea">
            </div>

        <div class="choices-panel" id="choicesPanel">
            </div>
    </div>

</div>

<script src="js/Simulator.js"></script>
<script>
    // Офлайн-оболонка: реєструємо service worker і тут (на випадок, якщо застосунок відкрито одразу на цій сторінці)
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {}); }
</script>
</body>
</html>
