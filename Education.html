<script>

    // 1. ОНОВЛЕНА ФУНКЦІЯ ПОВЕРНЕННЯ (SPA ЛОГІКА)
    function handleFloatingBack() {
        let activeView = document.querySelector('.view.active').id;
        
        if (activeView === 'loginView' || activeView === 'adminView') {
            // Перевіряємо, чи ми всередині фрейму SkillHUB Assistant
            if (window.parent && typeof window.parent.closeModule === 'function') {
                window.parent.closeModule();
            } else {
                window.location.href = 'index.html'; 
            }
        } else if (activeView === 'courseView') {
            if (windowViewingEmployee || windowUserRole === 'admin' || windowUserRole === 'director') {
                windowViewingEmployee = null;
                switchView('adminView');
            } else {
                if (window.parent && typeof window.parent.closeModule === 'function') {
                    window.parent.closeModule();
                } else {
                    window.location.href = 'index.html'; 
                }
            }
        } else if (activeView === 'productView') {
            switchView('courseView');
        } else if (activeView === 'theoryView') {
            switchView('productView');
        } else if (activeView === 'warningView') {
            switchView('theoryView'); 
        } else if (activeView === 'resultView') {
            openCourse(currentCourseName);
        }
    }

    // 2. БЕЗПЕЧНЕ ВІДОБРАЖЕННЯ ДОСЯГНЕНЬ (Усунення помилки DOM)
    function checkNewAchievements(user) {
        if (!user || !user.achievements) return;
        let achCodes = String(user.achievements).split(',').map(s => s.trim()).filter(s => s !== "");
        let savedCount = parseInt(localStorage.getItem(`ach_count_${user.login}`)) || 0;

        const achBtn = document.getElementById('achBtn');
        const achDot = document.getElementById('achNotificationDot');

        if (achCodes.length > savedCount) {
            if (achDot) achDot.style.display = 'block';
            if (achBtn) achBtn.classList.add('has-new');
        } else {
            if (achDot) achDot.style.display = 'none';
            if (achBtn) achBtn.classList.remove('has-new');
        }
    }

    function toggleAchievements() {
        const drawer = document.getElementById('achDrawer');
        const overlay = document.getElementById('achOverlay');
        
        if (drawer.classList.contains('open')) {
            drawer.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = ''; 
            document.querySelectorAll('.ach-card.zoomed').forEach(c => c.classList.remove('zoomed'));
        } else {
            // Безпечне звернення до елементів
            const achDot = document.getElementById('achNotificationDot');
            if (achDot) achDot.style.display = 'none';
            
            const achBtn = document.getElementById('achBtn');
            if(achBtn) achBtn.classList.remove('has-new');

            document.body.style.overflow = 'hidden'; 

            let user = db.users.find(u => u.login === currentUser);
            if(user && user.achievements) {
                 let count = String(user.achievements).split(',').filter(s => s.trim() !== "").length;
                 localStorage.setItem(`ach_count_${user.login}`, count);
            }

            renderAchievements();
            drawer.classList.add('open');
            overlay.classList.add('active');
        }
    }

    // 3. ОНОВЛЕНІ ШЛЯХИ ДО АЧІВОК
    const ACH_EXTS = ['.svg', '.png', '.jpg', '.jpeg', '.webp', '.gif'];
    function handleAchImageError(img) {
        let extIdx = parseInt(img.getAttribute('data-ext-index')) || 0;
        let code = img.getAttribute('data-code');
        extIdx++;
        if (extIdx < ACH_EXTS.length) {
            img.setAttribute('data-ext-index', extIdx);
            // Змінено шлях
            img.src = `../assets/achievements/${code}${ACH_EXTS[extIdx]}`;
        } else {
            img.outerHTML = '<span style="font-size:40px;">🏅</span>';
        }
    }
    
    function renderAchievements() {
        // ... логіка без змін ...
            html += `
            <div class="ach-card" onclick="toggleAchZoom(this)">
                <div class="ach-icon-wrapper">
                    <img src="../assets/achievements/${safeCode}.svg" class="ach-icon" alt="${displayName}" data-code="${safeCode}" data-ext-index="0" onerror="handleAchImageError(this)">
                </div>
                </div>`;
        // ...
    }

    // ... (решта логіки Education.html без змін) ...
</script>
