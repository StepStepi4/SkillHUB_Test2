<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чекліст перевірки SkillHUB</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--muted:#6b7280;--border:#e5e5ea;--ok:#10b981}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f5;--muted:#98989d;--border:#38383a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px 40px}
.top{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:2}
h1{font-size:22px;margin:0 0 8px}.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.cnt{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center}
button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
section{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:6px 14px 8px;margin:14px 0}
h2{font-size:16px;margin:10px 0 4px}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border);cursor:pointer}.it:first-of-type{border-top:0}
.it input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--ok)}
.it input:checked+span{color:var(--muted);text-decoration:line-through}
</style></head><body>
<div class="top"><h1>Чекліст перевірки SkillHUB</h1><div class="bar"><i id="b"></i></div><div class="cnt"><span id="c"></span><button onclick="resetAll()">Скинути відмітки</button></div></div>
<section><h2>🚀 Запуск і завантаження</h2><label class="it"><input type="checkbox" data-i="1"><span>Перший запуск без кешу: чорно-біле «LOADING» зі штрихованою смугою, відсотки ростуть</span></label><label class="it"><input type="checkbox" data-i="2"><span>Повторний запуск: додаток відкривається одразу з кешу, без довгого завантаження</span></label><label class="it"><input type="checkbox" data-i="3"><span>Стартова сторінка зі встановлення: кнопка «Згорнути» веде в додаток</span></label><label class="it"><input type="checkbox" data-i="4"><span>Галочка «Додаток встановлено, більше не показувати інструкцію» вимикає сторінку назавжди</span></label><label class="it"><input type="checkbox" data-i="5"><span>Після оновлення додатка інструкція зі встановлення НЕ з&#x27;являється</span></label><label class="it"><input type="checkbox" data-i="6"><span>Відкриття з іконки на робочому столі (iOS / Android) працює без адресного рядка</span></label></section><section><h2>🔎 Вкладка «Пошук»</h2><label class="it"><input type="checkbox" data-i="7"><span>Пошук категорії українською, російською, англійською, транслітом</span></label><label class="it"><input type="checkbox" data-i="8"><span>Пошук без апострофа знаходить назву з апострофом (напр. «Smart підписка»)</span></label><label class="it"><input type="checkbox" data-i="9"><span>У полі пошуку знаходяться пункти меню SkillHUB, клік відкриває потрібну функцію</span></label><label class="it"><input type="checkbox" data-i="10"><span>Після вибору категорії розраховуються сервіси за ціною пристрою</span></label><label class="it"><input type="checkbox" data-i="11"><span>Картки сервісів: ціна, знижка, порівняння, відкриття опису</span></label><label class="it"><input type="checkbox" data-i="12"><span>Опис сервісу відображається з форматуванням (як у Education)</span></label><label class="it"><input type="checkbox" data-i="13"><span>Зверху на сторінці НЕМАЄ блока новин</span></label></section><section><h2>📦 Вкладка «Резерви»</h2><label class="it"><input type="checkbox" data-i="14"><span>Вибір магазину зберігається і підставляється при наступному запуску</span></label><label class="it"><input type="checkbox" data-i="15"><span>Список резервів відповідає обраному магазину</span></label><label class="it"><input type="checkbox" data-i="16"><span>Пошук по резервах (укр/рос/англ)</span></label><label class="it"><input type="checkbox" data-i="17"><span>Дата «Останнє оновлення» відображається</span></label><label class="it"><input type="checkbox" data-i="18"><span>Картка товару відкривається, сервіси до товару рахуються</span></label><label class="it"><input type="checkbox" data-i="19"><span>Зверху на сторінці НЕМАЄ блока новин</span></label></section><section><h2>🧭 Вкладка «SkillHUB»</h2><label class="it"><input type="checkbox" data-i="20"><span>Кнопки меню з таблиці «Кнопки SkillHUB» відображаються з іконками</span></label><label class="it"><input type="checkbox" data-i="21"><span>Кожна кнопка відкриває своє посилання / модалку (Рейтинг, Калькулятор Клочківської тощо)</span></label><label class="it"><input type="checkbox" data-i="22"><span>«Додати в обране» додає кнопки у швидкий доступ, кнопка вгорі відкриває обране</span></label></section><section><h2>🎓 Вкладка «Академія»</h2><label class="it"><input type="checkbox" data-i="23"><span>Кнопка в нижньому меню між SkillHUB і Опціями, іконка на ~20–25% більша, підсвітка зелена (в темній темі теж)</span></label><label class="it"><input type="checkbox" data-i="24"><span>Нижнє меню лишається видимим в Академії, кнопки «Назад» на вході й в кабінеті немає</span></label><label class="it"><input type="checkbox" data-i="25"><span>Вхід за логіном/паролем, галочка «Запамʼятати мене» чорна (у темній — біла), кнопка «УВІЙТИ» чорна (у темній — біла)</span></label><label class="it"><input type="checkbox" data-i="26"><span>Кабінет: курси, статуси, тести проходяться, результати зберігаються</span></label><label class="it"><input type="checkbox" data-i="27"><span>Діаграма прогресу чорно-біло-сіра, без бірюзового #164f58 (текст, іконки, діаграми)</span></label><label class="it"><input type="checkbox" data-i="28"><span>Перехід на інші вкладки з Академії закриває її й підсвічує обрану вкладку</span></label><label class="it"><input type="checkbox" data-i="29"><span>Керівник бачить співробітників, може переглянути чужий кабінет і повернутись назад</span></label></section><section><h2>⚙️ Вкладка «Опції»</h2><label class="it"><input type="checkbox" data-i="30"><span>Іконки: тема, розмір тексту, оновлення, зворотній звʼязок, голосувалка, скидання</span></label><label class="it"><input type="checkbox" data-i="31"><span>Темна тема перемикається, іконки-гліфи стають білими</span></label><label class="it"><input type="checkbox" data-i="32"><span>Розмір тексту змінює масштаб інтерфейсу</span></label><label class="it"><input type="checkbox" data-i="33"><span>«Магазин за замовчуванням» відсутній (магазин міняється в Резервах)</span></label><label class="it"><input type="checkbox" data-i="34"><span>Рядок «Голосувалка» зʼявляється ЛИШЕ коли в таблиці є голосування зі статусом «Відкрито»</span></label><label class="it"><input type="checkbox" data-i="35"><span>«Скинути налаштування» повертає заводський стан і не показує знову інструкцію зі встановлення</span></label><label class="it"><input type="checkbox" data-i="36"><span>Напису «Скрипт V6» немає (червоне попередження лише якщо скрипт застарілий)</span></label></section><section><h2>📣 Новини</h2><label class="it"><input type="checkbox" data-i="37"><span>Кнопка News у шапці справа, на всіх вкладках, іконка чорна (у темній темі біла)</span></label><label class="it"><input type="checkbox" data-i="38"><span>При запуску з непрочитаною новиною вікно зʼявляється саме</span></label><label class="it"><input type="checkbox" data-i="39"><span>Закрив хрестиком без «Зрозуміло» → кнопка пульсує червоним</span></label><label class="it"><input type="checkbox" data-i="40"><span>«Зрозуміло» / відкриття кнопкою → пульсація зникає</span></label><label class="it"><input type="checkbox" data-i="41"><span>Дата з колонки A, текст з колонки B, форматування як в описах сервісів (таблиці, виноски, списки)</span></label><label class="it"><input type="checkbox" data-i="42"><span>Нова новина в таблиці → знову зʼявляється й пульсує</span></label></section><section><h2>💬 Зворотній звʼязок</h2><label class="it"><input type="checkbox" data-i="43"><span>Питання беруться з шапок рядка 1 листа «Зворотній звʼязок і пропозиції»</span></label><label class="it"><input type="checkbox" data-i="44"><span>«Оцініть…» → повзунок 1–10, відповідь записується під питанням</span></label><label class="it"><input type="checkbox" data-i="45"><span>Звичайне питання → поле для розгорнутої відповіді, записується під питанням</span></label><label class="it"><input type="checkbox" data-i="46"><span>Текстові відповіді — раз на добу, кожна «Оцінка» — один раз</span></label><label class="it"><input type="checkbox" data-i="47"><span>Форма відкривається швидко; без інтернету — зрозуміле повідомлення</span></label></section><section><h2>🗳 Голосування</h2><label class="it"><input type="checkbox" data-i="48"><span>Питання з B1, варіанти нижче, «Питання 2:» — другий блок</span></label><label class="it"><input type="checkbox" data-i="49"><span>Голос додає +1 у колонку C відповідного варіанта (число перезаписується)</span></label><label class="it"><input type="checkbox" data-i="50"><span>Один голос на питання з одного логіну/пристрою</span></label><label class="it"><input type="checkbox" data-i="51"><span>Статус «Закрито» → рядок зникає з Опцій, голосувати не можна</span></label></section><section><h2>♻️ Оновлення і офлайн</h2><label class="it"><input type="checkbox" data-i="52"><span>«Оновити додаток і базу даних»: HUD-завантаження, очищення кешу, перевірка цілісності, тестовий перезапуск (все за кілька секунд)</span></label><label class="it"><input type="checkbox" data-i="53"><span>Після оновлення зʼявляється підсумок «Додаток оновлено, усе працює»</span></label><label class="it"><input type="checkbox" data-i="54"><span>Без інтернету кнопка попереджає і нічого не видаляє</span></label><label class="it"><input type="checkbox" data-i="55"><span>Режим літака: додаток відкривається і працює з кешу</span></label><label class="it"><input type="checkbox" data-i="56"><span>Файли оновились: після релізу додаток сам підхоплює нову версію</span></label></section><section><h2>📊 Google Apps Script / таблиця</h2><label class="it"><input type="checkbox" data-i="57"><span>Меню «🧭 Навігація» вгорі таблиці: 13 пунктів відкривають потрібні листи</span></label><label class="it"><input type="checkbox" data-i="58"><span>Лише одна резервна вкладка «_bak_Education», яка перезаписується</span></label><label class="it"><input type="checkbox" data-i="59"><span>Лист «📣 Новини»: A — дата, B — текст</span></label><label class="it"><input type="checkbox" data-i="60"><span>Лист «Голосувалка»: колонка C рахує голоси, статус «Відкрито/Закрито» працює</span></label><label class="it"><input type="checkbox" data-i="61"><span>Лист «Зворотній звʼязок і пропозиції»: відповіді зʼявляються під шапками</span></label><label class="it"><input type="checkbox" data-i="62"><span>Після нового розгортання у вкладці Опції немає червоного «Скрипт застарілий»</span></label></section><section><h2>🛠 Тренажери і редактор</h2><label class="it"><input type="checkbox" data-i="63"><span>Format.html: форматування, таблиці, кнопки, картинки (посилання або шлях assets/…, посилання GitHub/Drive)</span></label><label class="it"><input type="checkbox" data-i="64"><span>Objections.html: тренажер заперечень, оцінка відповіді</span></label><label class="it"><input type="checkbox" data-i="65"><span>Objections-Admin.html: додавання, редагування, видалення заперечень</span></label></section>
<script>
var K='skillhub_checklist_v1',N=65,st={};
try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
var boxes=[].slice.call(document.querySelectorAll('input[data-i]'));
function upd(){var d=boxes.filter(function(x){return x.checked}).length;document.getElementById('b').style.width=(d/N*100)+'%';document.getElementById('c').textContent='Перевірено '+d+' з '+N}
boxes.forEach(function(x){x.checked=!!st[x.dataset.i];x.addEventListener('change',function(){st[x.dataset.i]=x.checked?1:0;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}upd()})});
function resetAll(){if(!confirm('Скинути всі відмітки?'))return;st={};try{localStorage.removeItem(K)}catch(e){}boxes.forEach(function(x){x.checked=false});upd()}
upd();
</script></body></html>
