<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkillHUB Assistant</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">

    <link rel="stylesheet" href="style/style.css">
    
    <!-- Добавляем стили, чтобы элементы не появлялись с задержкой -->
    <style>
        .top-search-panel { display: none; }
        .top-search-panel.show { display: flex; }
        .compare-bar { display: flex; }
        #appLoader { z-index: 999999; }
    </style>
    <style id="dynamicFontScale"></style>
</head>
<body>

<div id="topSearchPanel" class="top-search-panel">
    <div class="top-search-content">
        <input type="text" id="topReservesSearchInput" placeholder="Пошук у резервах..." autocomplete="off">
        <button id="clearTopSearchBtn" class="top-search-clear">×</button>
    </div>
    <button id="closeTopSearchBtn" class="top-search-close">Скасувати</button>
</div>

<div id="appLoader" class="app-loader">
    <div class="spinner" id="loaderSpinner"></div>
    <div class="loader-text" id="mainLoaderText">Підготовка</div>
    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<div class="container">
    <div style="display: flex; gap: 12px; margin-bottom: 16px; align-items: stretch;">
        <div style="width: 4px; background: linear-gradient(to bottom, #0057b7 50%, #ffd700 50%); border-radius: 2px; flex-shrink: 0;"></div>
        <div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 2px 0;">
            <div class="header-row" id="mainHeader" style="margin-bottom: 0; justify-content: flex-start;">
                <h2 id="headerTitle" style="line-height: 1;">SkillHUB Assistant</h2>
            </div>
            <div style="font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center;">
                Харківський регіон <span style="font-size: 14px; margin-left: 4px;">🫶</span>
            </div>
        </div>
    </div>
    
    <div class="status-container" id="statusContainer">
        <div class="status-badge">
            <div id="statusDot" class="dot yellow pulse"></div>
            <span id="statusText">Підключення</span>
        </div>
    </div>

    <div id="tab-search" class="app-tab active">
        <div class="input-group">
            <input type="text" id="catInput" placeholder="Яку техніку чи послугу шукаємо?" autocomplete="off" disabled>
            <button id="clearAllBtn" class="clear-btn" style="display:none;">×</button>
            <div id="customSuggestions" class="suggestions" style="display:none;"></div>
        </div>
        <div id="priceWrapper" class="input-group" style="display:none; gap:10px; flex-direction:row;">
            <input type="number" id="devicePrice" placeholder="Вартість техніки ₴" inputmode="numeric" style="flex:1; margin-bottom:0;">
            <button class="btn btn-primary" id="okBtn" style="width: auto; padding: 0 24px;">ОК</button>
        </div>
        <div id="result" style="display:none;">
            <div class="ua-name" id="uaTitle" style="font-size:20px; font-weight:800; margin-bottom:5px; text-align: left;"></div>
            <div class="item-category" id="itemCategory" style="margin-bottom:20px; opacity:0.7; font-size:13px; text-transform: uppercase; font-weight: 700; text-align: left;"></div>
            <div id="techInfo"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-weight:700; font-size:13px; text-transform:uppercase; color:var(--text-muted); letter-spacing: 0.5px;">Сервіси</span>
                <button id="toggleCompareBtn" class="compare-toggle-btn" style="display:none;">Порівняти</button>
            </div>
            <div id="serviceList" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
    </div>

    <div id="tab-reserves" class="app-tab">
        <div class="input-group" style="display: flex; gap: 10px; align-items: center; margin-bottom: 8px;">
            <select id="storeFilter" style="flex: 1; margin-bottom: 0;">
                <option value="">-- Оберіть магазин --</option>
            </select>
            <button id="openTopSearchBtn" class="reserves-search-trigger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px; height:20px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </div>
        <div id="rezervyDateContainer" style="font-size: 11px; color: var(--text-muted); text-align: right; margin-bottom: 12px; font-weight: 600;"></div>
        <div id="rezervyList" class="list-group"></div>
    </div>

    <div id="tab-skillhub" class="app-tab">
        <div class="list-group" id="dynamicSkillHubButtons"></div>
    </div>

    <div id="tab-settings" class="app-tab">
        <div class="list-group">
            <div class="list-item">
                <div class="list-item-content">
                    <span class="list-item-title">Темна тема</span>
                    <span class="list-item-subtitle">Змінити оформлення додатку</span>
                </div>
                <button id="themeToggle" class="toggle-switch">
                    <div class="toggle-knob"></div>
                </button>
            </div>
            <div class="list-item" style="flex-direction:column; align-items:flex-start;">
                <div class="list-item-content" style="margin-bottom: 10px; width:100%;">
                    <span class="list-item-title">Розмір тексту</span>
                    <span class="list-item-subtitle">Налаштуйте масштаб інтерфейсу</span>
                </div>
                <div style="display:flex; align-items:center; width:100%; gap:12px; color:var(--text-muted);">
                    <span>A</span><input type="range" id="fontSizeSlider" min="0.85" max="1.3" step="0.05" value="1"><span>A</span>
                </div>
            </div>
            <div class="list-item" style="flex-direction:column; align-items:flex-start;">
                <div class="list-item-content" style="margin-bottom: 10px; width:100%;">
                    <span class="list-item-title">🏪 Магазин</span>
                    <span class="list-item-subtitle">Для швидкого доступу до резервів</span>
                </div>
                <select id="defaultStoreSelect" style="background: var(--input-bg); margin-bottom: 0;"></select>
            </div>
        </div>
        <div class="list-group">
            <button class="list-item" id="forceUpdateBtn">
                <div class="list-item-content">
                    <span class="list-item-title">🔄 Оновити базу даних</span>
                    <span class="list-item-subtitle">Очистити кеш та завантажити дані</span>
                </div>
            </button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" data-tab="tab-search"><div class="nav-icon icon-search"></div><span>Пошук</span></button>
    <button class="nav-item" data-tab="tab-reserves"><div class="nav-icon icon-rezerv"></div><span>Резерви</span></button>
    <button class="nav-item" data-tab="tab-skillhub"><div class="nav-icon icon-bulb"></div><span>SkillHUB</span></button>
    <button class="nav-item" data-tab="tab-settings"><div class="nav-icon icon-settings"></div><span>Опції</span></button>
</nav>

<div class="compare-bar" id="compareBar">
    <div style="font-weight:600; font-size: 15px; color: var(--text-main);" id="compareStatusText">Оберіть 2 сервіси</div>
    <button class="btn btn-primary" id="compareExecuteBtn" disabled style="width:auto; padding: 10px 20px; border-radius: 12px;">Порівняти</button>
</div>

<div class="floating-top" id="scrollTopBtn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
</div>

<!-- Модалки -->
<div id="rezervItemModal" class="modal"><div class="modal-content"><div class="modal-header"><div class="modal-title" id="rezervItemTitle"></div><button class="modal-close" onclick="window.closeModalBase('rezervItemModal')"></button></div><div id="rezervItemBody" class="modal-body"><div id="rezervTechInfo"></div><div id="rezervServiceList"></div></div></div></div>
<div id="descModal" class="modal"><div class="modal-content"><div class="modal-header"><div class="modal-title" id="modalTitle"></div><button class="modal-close" onclick="window.closeModalBase('descModal')"></button></div><div id="modalBody" class="modal-body"></div><button class="btn btn-primary" onclick="window.closeModalBase('descModal')">Зрозуміло</button></div></div>
<div id="compareModal" class="modal"><div class="modal-content"><div class="modal-header"><div class="modal-title">Результат порівняння</div><button class="modal-close" onclick="window.closeCompareModal()"></button></div><div id="compareModalBody" class="modal-body"></div></div></div>
<div id="spa-module-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 1000000; opacity: 0; display: none; transition: opacity 0.3s;"><iframe id="spa-frame" src="" style="width: 100%; height: 100%; border: none;"></iframe></div>

<script src="js/app.js" defer></script>
</body>
</html>
