<!-- Контейнер страницы поиска -->
<div class="search-container">
  <h2>Пошук по базі</h2>
  
  <!-- Поле для ввода текста. При вводе каждого символа запускается функция handleSearch() -->
  <input type="text" id="searchInput" class="search-input" placeholder="Введіть 2-3 символи..." oninput="handleSearch()">
  
  <!-- Сообщение о загрузке данных -->
  <div id="loadingMessage" class="loading-text">Завантаження бази... Зачекайте.</div>
  
  <!-- Здесь будут появляться результаты поиска -->
  <div id="searchResults" class="results-container"></div>
</div>

<!-- Запускаем загрузку данных сразу при открытии этой страницы -->
<script>
  // Вызываем функцию загрузки, которая написана в app.js
  loadSearchData();
</script>
